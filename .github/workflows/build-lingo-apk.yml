name: Build LINGO APK

on:
  push:
    branches: [main]
    paths:    ['lingo-app/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: lingo-app
        run: npm install --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo prebuild (Android)
        working-directory: lingo-app
        run: npx expo prebuild --platform android --no-install

      - name: Create splash screen placeholder images
        working-directory: lingo-app
        run: |
          # 1x1 dark PNG — Expo references splashscreen_logo but doesn't generate it when no image is set
          SPLASH_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          for DIR in drawable drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$DIR"
            echo "$SPLASH_B64" | base64 -d > "android/app/src/main/res/$DIR/splashscreen_logo.png"
          done

      - name: Write local.properties
        working-directory: lingo-app
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradle wrapper executable
        working-directory: lingo-app
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-lingo-${{ hashFiles('lingo-app/android/**/*.gradle*', 'lingo-app/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-lingo-

      - name: Build debug APK
        working-directory: lingo-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find lingo-app/android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Resolve tag
        id: tag
        run: echo "value=lingo-build-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp "${{ steps.apk.outputs.path }}" "LINGO-${{ steps.tag.outputs.value }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LINGO-${{ steps.tag.outputs.value }}
          path: LINGO-${{ steps.tag.outputs.value }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: LINGO ${{ steps.tag.outputs.value }}
          body: |
            ## LINGO — Talk. Tap. Understand.

            Real-time speech transcription with instant word & phrase explanations.
            Tap any word in the transcript to get the meaning, usage, and examples.

            ### ⬇️ Install on Android
            1. Download **LINGO-${{ steps.tag.outputs.value }}.apk** below
            2. Phone → **Settings → Security → Install unknown apps** → allow browser
            3. Tap the APK → Install

            ### First launch
            - Open ⚙️ Settings → add your **Deepgram** key (transcription) and **Claude** key (explanations)
            - Tap the mic on the Live tab → speak → tap any word for instant explanation
          files: LINGO-${{ steps.tag.outputs.value }}.apk
          draft: false
          prerelease: false
