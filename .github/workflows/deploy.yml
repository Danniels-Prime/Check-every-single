name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── ÆTHERMIND (root app) ─────────────────────────────────────────────
      - name: Install ÆTHERMIND dependencies
        run: npm install

      - name: Build ÆTHERMIND
        run: npm run build

      # ── OVERLAYLANG (sub-app at /overlaylang/) ───────────────────────────
      - name: Install OverlayLang dependencies
        working-directory: overlaylang-web
        run: npm install

      - name: Build OverlayLang
        working-directory: overlaylang-web
        run: npm run build

      # ── Merge into single artifact ───────────────────────────────────────
      - name: Merge build outputs
        run: |
          mkdir -p dist/overlaylang
          cp -r overlaylang-web/dist/. dist/overlaylang/

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
