name: Build LinguaOverlay APK

on:
  push:
    branches: [main]
    paths: ['lingua-overlay/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        working-directory: lingua-overlay
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download Gradle wrapper jar
        working-directory: lingua-overlay
        run: |
          mkdir -p gradle/wrapper
          curl -Lo gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar

      - name: Make Gradle wrapper executable
        working-directory: lingua-overlay
        run: |
          curl -Lo gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-lingua-${{ hashFiles('lingua-overlay/**/*.gradle*', 'lingua-overlay/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-lingua-

      - name: Build debug APK
        working-directory: lingua-overlay
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find lingua-overlay/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Resolve tag
        id: tag
        run: echo "value=lingua-build-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp "${{ steps.apk.outputs.path }}" "LinguaOverlay-${{ steps.tag.outputs.value }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaOverlay-${{ steps.tag.outputs.value }}
          path: LinguaOverlay-${{ steps.tag.outputs.value }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: LinguaOverlay ${{ steps.tag.outputs.value }}
          body: |
            ## LinguaOverlay — Tap any word. Anywhere. Instant translation.

            Works system-wide across ALL apps. Select any word → translation card appears → reads it aloud.
            Also includes live mic transcription — hear something, tap the word, get the meaning.

            ### ⬇️ Install on Android
            1. Download **LinguaOverlay-${{ steps.tag.outputs.value }}.apk** below
            2. Phone → **Settings → Security → Install unknown apps** → allow your browser
            3. Tap the APK → Install

            ### Setup (one-time, 3 steps)
            1. Tap **Grant Overlay Permission** → allow
            2. Tap **Enable Accessibility Service** → find LinguaOverlay → toggle on
            3. Tap **Add API Keys** → enter your Claude key + Deepgram key

            ### How to use
            - **Translate anything**: Select/highlight any word in any app → card pops up automatically
            - **Live transcription**: Tap "Start Live Transcription" → speak → tap any word in the transcript
            - Card reads the translation aloud automatically. Tap 🔊 to replay.

            > API keys are stored encrypted on-device only. Never sent anywhere except Claude/Deepgram APIs.
          files: LinguaOverlay-${{ steps.tag.outputs.value }}.apk
          draft: false
          prerelease: false
